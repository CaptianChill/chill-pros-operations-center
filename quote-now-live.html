<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02060b"><title>Chill Pros Quote Now</title><style>:root{color-scheme:dark;--ice:#58c8ff;--line:#174462;--muted:#8ea5b8;--ok:#67e8a7;--bad:#ff7d7d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#02060b;color:#eef8ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}body{min-height:100dvh}input,textarea,button{font:inherit}input,textarea{font-size:16px!important}.wrap{width:min(980px,100%);margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:48px;height:48px;object-fit:contain}.status{border:1px solid var(--line);border-radius:999px;padding:8px 10px;color:var(--muted);font-size:12px}.status.ok{color:var(--ok)}.grid{display:grid;grid-template-columns:360px 1fr;gap:16px}.card{background:#07111c;border:1px solid #1d5b80;border-radius:18px;padding:18px}.field{display:grid;gap:6px;margin-bottom:11px}.field label{font-size:12px;color:#b8c9d5}.field input,.field textarea{width:100%;background:#020912;border:1px solid var(--line);border-radius:12px;color:#fff;padding:13px}.field textarea{min-height:96px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btns{display:flex;flex-wrap:wrap;gap:9px}.btn{border:1px solid #27678d;background:#0a1c29;color:#dff6ff;border-radius:12px;padding:12px 14px;font-weight:800}.btn.primary{background:linear-gradient(135deg,#8ee3ff,#28a9e8);color:#00121c;border:0}.btn.good{background:#0d3528;border-color:#2f8060;color:#9af0c6}.btn:disabled{opacity:.45}.msg{min-height:18px;color:var(--bad);font-size:12px;margin:8px 0}.msg.ok{color:var(--ok)}.preview{background:#fff;color:#10202a;border-radius:14px;padding:22px;min-height:380px}.preview h2{margin:0}.total{display:flex;justify-content:space-between;font-size:22px;font-weight:900;border-top:1px solid #d8e4ea;margin-top:20px;padding-top:14px}.hide{display:none!important}.login{max-width:460px;margin:8vh auto}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:12px}.row{grid-template-columns:1fr}.top{align-items:flex-start}}@media print{body{background:#fff}.top,.editor{display:none!important}.grid{display:block}.card{border:0}.preview{border-radius:0}}</style></head><body><div class="wrap"><div class="top"><div class="brand"><img src="cp-app-icon.png"><div><strong>CHILL PROS</strong><div style="color:#8ea5b8;font-size:12px">Quote Now — resilient mode</div></div></div><div id="status" class="status">Ready for secure sign-in</div></div><section id="login" class="card login"><h1>Sign in</h1><p style="color:#8ea5b8">This version authenticates directly with Firebase REST and does not depend on the Firebase browser SDK.</p><form id="loginForm"><div class="field"><label>Email</label><input name="email" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input name="password" type="password" autocomplete="current-password" required></div><div id="loginMsg" class="msg"></div><button id="loginBtn" class="btn primary">SIGN IN</button></form></section><main id="app" class="grid hide"><section class="card editor"><h1>New quote</h1><div class="field"><label>Customer / company</label><input id="customer"></div><div class="field"><label>Customer email</label><input id="email" type="email"></div><div class="field"><label>Reference / Job ID</label><input id="job"></div><div class="field"><label>Scope of work</label><textarea id="scope"></textarea></div><div class="field"><label>Line item</label><input id="desc"></div><div class="row"><div class="field"><label>Qty</label><input id="qty" type="number" min="1" value="1"></div><div class="field"><label>Unit price</label><input id="price" type="number" min="0" step="0.01" inputmode="decimal"></div></div><div id="actionMsg" class="msg"></div><div class="btns"><button id="save" class="btn primary">Save draft</button><button id="approve" class="btn good" disabled>Approve quote</button><button id="print" class="btn">Print / PDF</button><button id="copy" class="btn">Copy summary</button><button id="mail" class="btn">Open email</button><button id="logout" class="btn">Sign out</button></div></section><section class="card"><div id="preview" class="preview"></div></section></main></div><script>(()=>{'use strict';const API_KEY='AIzaSyBsBEKMggwSUvEmdTTK1rjYOcdPyYCCLOc';const OPS='https://us-central1-chill-pros-ice-stream.cloudfunctions.net/nativeOpsApi';let idToken='',quoteId='';const $=id=>document.getElementById(id);const money=n=>Number(n||0).toLocaleString('en-US',{style:'currency',currency:'USD'});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function d(){return{customer:$('customer').value.trim(),email:$('email').value.trim(),job:$('job').value.trim(),scope:$('scope').value.trim(),desc:$('desc').value.trim(),qty:Math.max(1,Number($('qty').value||1)),price:Number($('price').value||0)}}function render(){const x=d(),t=x.qty*x.price;$('preview').innerHTML=`<h2>CHILL PROS</h2><div>Professional Service Quote</div><hr><strong>${esc(x.customer||'Customer')}</strong><div>${esc(x.email||'')}</div>${x.job?`<div>Reference: ${esc(x.job)}</div>`:''}<p>${esc(x.scope||'Scope of work')}</p><div>${esc(x.desc||'Service / repair')} — ${x.qty} × ${money(x.price)}</div><div class="total"><span>Total</span><span>${money(t)}</span></div>${quoteId?`<p>Quote ID: ${esc(quoteId)}</p>`:''}`};['customer','email','job','scope','desc','qty','price'].forEach(i=>$(i).addEventListener('input',render));function msg(id,text,ok=false){$(id).textContent=text;$(id).className=ok?'msg ok':'msg'}async function timeoutFetch(url,opt={},ms=12000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{return await fetch(url,{...opt,signal:c.signal})}finally{clearTimeout(t)}}async function signIn(email,password){const r=await timeoutFetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${API_KEY}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password,returnSecureToken:true})},12000);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error?.message||`Sign-in failed (${r.status})`);return j}async function secure(path,body){if(!idToken)throw Error('Please sign in again.');const r=await timeoutFetch(OPS+path,{method:'POST',headers:{Authorization:`Bearer ${idToken}`,'Content-Type':'application/json'},body:JSON.stringify(body||{})},15000);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||`Request failed (${r.status})`);return j}$('loginForm').onsubmit=async e=>{e.preventDefault();const b=$('loginBtn');b.disabled=true;b.textContent='SIGNING IN…';msg('loginMsg','');const fd=new FormData(e.currentTarget);try{const out=await signIn(String(fd.get('email')).trim(),String(fd.get('password')));idToken=out.idToken;$('login').classList.add('hide');$('app').classList.remove('hide');$('status').textContent=`Signed in • ${out.email||'Chill Pros'}`;$('status').classList.add('ok');render()}catch(err){msg('loginMsg',err.name==='AbortError'?'Sign-in timed out. Check connection and retry.':err.message);b.disabled=false;b.textContent='SIGN IN'}};$('save').onclick=async()=>{const x=d();if(!x.desc||!x.price)return msg('actionMsg','Enter a line item and price first.');const b=$('save');b.disabled=true;b.textContent='Saving…';try{const out=await secure('/quotes',{customerName:x.customer,customerEmail:x.email,jobId:x.job||undefined,scope:x.scope,lines:[{description:x.desc,quantity:x.qty,unitPrice:x.price}]});quoteId=out.id;$('approve').disabled=false;render();msg('actionMsg',`Draft saved • ${money(out.total)}`,true)}catch(err){msg('actionMsg',err.name==='AbortError'?'Quote service timed out. Try again.':err.message)}finally{b.disabled=false;b.textContent='Save draft'}};$('approve').onclick=async()=>{if(!quoteId)return;try{await secure(`/quotes/${encodeURIComponent(quoteId)}/approve`,{});msg('actionMsg','Quote approved and saved.',true)}catch(err){msg('actionMsg',err.message)}};$('print').onclick=()=>window.print();$('copy').onclick=async()=>{const x=d(),text=`CHILL PROS — SERVICE QUOTE\nCustomer: ${x.customer}\n${x.email?`Email: ${x.email}\n`:''}${x.job?`Reference: ${x.job}\n`:''}\nScope:\n${x.scope}\n\n${x.desc} — ${x.qty} × ${money(x.price)}\nTOTAL: ${money(x.qty*x.price)}${quoteId?`\nQuote ID: ${quoteId}`:''}`;try{await navigator.clipboard.writeText(text);msg('actionMsg','Quote summary copied.',true)}catch{msg('actionMsg','Copy unavailable. Use Print / PDF.')}};$('mail').onclick=()=>{const x=d();location.href=`mailto:${encodeURIComponent(x.email)}?subject=${encodeURIComponent('Chill Pros Service Quote')}&body=${encodeURIComponent(`Hello ${x.customer},\n\nScope of work:\n${x.scope}\n\n${x.desc}\nTotal: ${money(x.qty*x.price)}${quoteId?`\nQuote ID: ${quoteId}`:''}\n\nThank you,\nChill Pros`)}`};$('logout').onclick=()=>{idToken='';quoteId='';$('app').classList.add('hide');$('login').classList.remove('hide');$('status').textContent='Ready for secure sign-in';$('status').classList.remove('ok');$('loginBtn').disabled=false;$('loginBtn').textContent='SIGN IN'};render()})();</script></body></html>
