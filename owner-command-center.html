<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BB Owner Command Center</title>
<style>
:root{--panel:#050b11;--card:#08131c;--line:#2b617d;--line2:#17384b;--text:#f7fbff;--muted:#9db3c0;--cyan:#1cc8ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}#app{min-height:100dvh;background:#000}.dashboard{position:relative;width:min(100vw,1536px);margin:0 auto;line-height:0;background:#000}.dashboard picture,.dashboard img{display:block;width:100%;height:auto}.hotspots{position:absolute;inset:0}.hotspots button{position:absolute;left:var(--x);top:var(--y);width:var(--w);height:var(--h);border:0;border-radius:16px;background:transparent;color:transparent;cursor:pointer}.hotspots button:hover{background:rgba(20,193,255,.08)}.hotspots button:focus-visible{outline:3px solid #fff;outline-offset:-3px;background:rgba(20,193,255,.16)}.hotspots button:active{background:rgba(255,255,255,.12)}.mobile-hotspots{display:none}.drawer-backdrop{position:fixed;inset:0;z-index:40;display:none;background:rgba(0,0,0,.78);backdrop-filter:blur(8px)}.drawer-backdrop.open{display:block}.drawer{position:fixed;z-index:50;top:0;right:0;width:min(620px,100vw);height:100dvh;transform:translateX(102%);transition:transform .24s ease;background:radial-gradient(circle at 50% -10%,rgba(25,173,226,.18),transparent 32%),linear-gradient(180deg,#07111a,#02070b 65%);border-left:1px solid var(--line);overflow:auto;padding-bottom:max(28px,env(safe-area-inset-bottom))}.drawer.open{transform:translateX(0)}.drawer-head{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:12px;padding:max(16px,env(safe-area-inset-top)) 18px 14px;background:rgba(3,8,12,.94);border-bottom:1px solid var(--line2);backdrop-filter:blur(14px)}.close-btn{width:44px;height:44px;border-radius:50%;border:1px solid #44738c;background:#07121a;color:#fff;font-size:25px}.drawer-title-wrap{min-width:0;flex:1}.eyebrow{color:var(--cyan);letter-spacing:.18em;font-size:11px;line-height:1.25}.drawer h1{margin:3px 0 0;font-size:24px;line-height:1.2}.online{white-space:nowrap;padding:6px 10px;border-radius:999px;border:1px solid #168349;color:#45ed8d;font-size:12px}.drawer-content{padding:18px}.hero{padding:18px;border:1px solid #315d73;border-radius:20px;background:linear-gradient(180deg,#0a1721,#061018);margin-bottom:16px}.hero h2{margin:0 0 7px;font-size:21px;line-height:1.25}.hero p{margin:0;color:var(--muted);line-height:1.55}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}.metric{border:1px solid var(--line2);background:var(--card);border-radius:16px;padding:15px}.metric .label{color:var(--muted);font-size:12px;line-height:1.3}.metric .value{margin-top:5px;font-size:22px;line-height:1.1}.section{border:1px solid #244d63;background:#061018;border-radius:18px;padding:16px;margin-bottom:14px}.section h3{margin:0 0 12px;font-size:17px}.row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:12px 0;border-bottom:1px solid #163343;line-height:1.35}.row:last-child{border-bottom:0}.row .sub{color:var(--muted);font-size:13px;margin-top:3px}.row .right{color:var(--cyan);text-align:right;white-space:nowrap}.badge{display:inline-block;padding:4px 8px;border-radius:999px;border:1px solid #25774b;color:#43ea88;font-size:11px}.project{border:1px solid #2c5c75;border-radius:18px;padding:16px;background:linear-gradient(180deg,#0a1721,#061018);margin-bottom:12px}.project-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.project h3{margin:3px 0 0;font-size:18px}.project-type{color:var(--cyan);font-size:11px;letter-spacing:.12em}.project p{color:var(--muted);line-height:1.5;margin:12px 0}.progress{height:10px;background:#142b38;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;width:var(--pct);background:linear-gradient(90deg,#19c7ff,#30df75)}.project-foot{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:12px}.action{border:1px solid #278ab5;background:#092336;color:#fff;padding:10px 12px;border-radius:12px;cursor:pointer}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.tabs button{border:1px solid #23495d;background:#07121a;color:#c7d7df;padding:10px 6px;border-radius:12px;font-size:12px}.tabs button.active{border-color:#22bfe9;color:#fff;background:#0b2635}.toast{position:fixed;z-index:80;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,18px);opacity:0;pointer-events:none;padding:12px 16px;border-radius:999px;border:1px solid #39758e;background:#071018;color:#fff;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:767px){.desktop-hotspots{display:none}.mobile-hotspots{display:block}.drawer{top:auto;bottom:0;width:100%;height:min(84dvh,900px);border-left:0;border-top:1px solid var(--line);border-radius:24px 24px 0 0;transform:translateY(102%)}.drawer.open{transform:translateY(0)}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.tabs{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app">
<main class="dashboard" aria-label="BB Owner Command Center">
<picture>
<source media="(max-width:767px)" srcset="https://github.com/user-attachments/assets/816b9e04-e54e-4c7d-99a0-3783a4ce2269">
<img src="https://github.com/user-attachments/assets/28a8189c-3bba-4448-800a-3d07e0b15aab" alt="BB Owner Command Center dashboard">
</picture>
<div class="hotspots desktop-hotspots" aria-label="Desktop dashboard controls">
<button data-panel="dashboard" style="--x:3%;--y:22%;--w:9%;--h:4.5%">Dashboard</button>
<button data-panel="projects" style="--x:3%;--y:27%;--w:9%;--h:4.5%">Projects</button>
<button data-panel="dispatch" style="--x:3%;--y:32%;--w:9%;--h:4.5%">Dispatch</button>
<button data-panel="jobs" style="--x:3%;--y:37%;--w:9%;--h:4.5%">Jobs</button>
<button data-panel="technicians" style="--x:3%;--y:42%;--w:9%;--h:4.5%">Technicians</button>
<button data-panel="customers" style="--x:3%;--y:47%;--w:9%;--h:4.5%">Customers</button>
<button data-panel="finances" style="--x:3%;--y:52%;--w:9%;--h:4.5%">Finances</button>
<button data-panel="analytics" style="--x:3%;--y:57%;--w:9%;--h:4.5%">Analytics</button>
<button data-panel="settings" style="--x:3%;--y:62%;--w:9%;--h:4.5%">Settings</button>
<button data-panel="dispatch" style="--x:14%;--y:84%;--w:17%;--h:6%">Dispatch</button>
<button data-panel="jobs" style="--x:32%;--y:84%;--w:14%;--h:6%">Jobs</button>
<button data-panel="technicians" style="--x:47%;--y:84%;--w:17%;--h:6%">Technicians</button>
<button data-panel="customers" style="--x:65%;--y:84%;--w:16%;--h:6%">Customers</button>
<button data-panel="alerts" style="--x:83%;--y:6%;--w:14%;--h:48%">Alerts</button>
</div>
<div class="hotspots mobile-hotspots" aria-label="Mobile dashboard controls">
<button data-panel="dashboard" style="--x:1%;--y:92%;--w:21%;--h:7%">Dashboard</button>
<button data-panel="projects" style="--x:22%;--y:92%;--w:20%;--h:7%">Projects</button>
<button data-panel="dashboard" style="--x:41%;--y:90%;--w:18%;--h:9%">Home</button>
<button data-panel="alerts" style="--x:59%;--y:92%;--w:19%;--h:7%">Alerts</button>
<button data-panel="settings" style="--x:78%;--y:92%;--w:21%;--h:7%">Settings</button>
<button data-panel="dispatch" style="--x:8%;--y:85%;--w:21%;--h:5%">Dispatch</button>
<button data-panel="jobs" style="--x:29%;--y:85%;--w:19%;--h:5%">Jobs</button>
<button data-panel="technicians" style="--x:48%;--y:85%;--w:25%;--h:5%">Technicians</button>
<button data-panel="customers" style="--x:73%;--y:85%;--w:22%;--h:5%">Customers</button>
<button data-panel="projects" style="--x:9%;--y:63%;--w:38%;--h:7%">Projects monitored</button>
<button data-panel="alerts" style="--x:9%;--y:71%;--w:38%;--h:7%">Approvals</button>
<button data-panel="crypto" style="--x:52%;--y:71%;--w:39%;--h:7%">Crypto</button>
</div>
</main>
<div id="backdrop" class="drawer-backdrop"></div>
<aside id="drawer" class="drawer" aria-hidden="true">
<header class="drawer-head">
<button id="closeBtn" class="close-btn" type="button" aria-label="Close panel">×</button>
<div class="drawer-title-wrap"><div class="eyebrow">BIG BB OWNER SYSTEM</div><h1 id="drawerTitle">Dashboard</h1></div>
<span class="online">ONLINE</span>
</header>
<div id="drawerContent" class="drawer-content"></div>
</aside>
<div id="toast" class="toast" aria-live="polite"></div>
</div>
<script>
const data={dashboard:{title:"Executive Dashboard",intro:"Private owner overview across business operations, commercial software, AI products and financial technology.",metrics:[["Active projects","4"],["Approvals","0"],["Systems online","4"],["Owner access","Private"]],rows:[["Operations Center","90% complete"],["FieldForged Platform","75% complete"],["Crypto AI Signal Lab","65% complete"],["Chill Bro Wizard","50% complete"]]},dispatch:{title:"Dispatch",intro:"Live operational overview for field-service activity.",metrics:[["Open calls","3"],["Unassigned","1"],["Emergency","0"],["Today","4 jobs"]],rows:[["CP-7821","High-priority HVAC • Assigned"],["CP-7822","Ice machine PM • Scheduled"],["CP-7823","Reach-in repair • Awaiting parts"],["CP-7824","Commercial kitchen • New request"]]},jobs:{title:"Jobs",intro:"Active, scheduled and pending work requiring owner visibility.",metrics:[["Today","4"],["Scheduled","8"],["Awaiting parts","2"],["Awaiting approval","0"]],rows:[["Today’s route","4 jobs"],["This week","12 jobs"],["Open estimates","5"],["Completed this month","31"]]},technicians:{title:"Technicians",intro:"Technician availability, job allocation and field status.",metrics:[["Active","2"],["Clocked in","1"],["Available","1"],["Alerts","0"]],rows:[["Mike Johnson","Clocked in • CP-7821"],["Owner / Lead Tech","Available"],["Open assignments","1"],["Overtime risk","None"]]},customers:{title:"Customers",intro:"Portfolio activity, follow-ups and account status.",metrics:[["Active customers","55"],["New this month","4"],["Care plans","18"],["Follow-ups","6"]],rows:[["Priority accounts","7"],["Quotes awaiting response","5"],["PM visits due","9"],["Past-due invoices","3"]]},finances:{title:"Finances",intro:"Owner-level financial snapshot across operating and software projects.",metrics:[["Monthly revenue","$12.4K"],["Receivables","$4.86K"],["Software MRR","Pre-launch"],["Review","Required"]],rows:[["Chill Pros","Operating revenue"],["FieldForged","Pre-revenue build"],["Crypto Lab","Paper trading only"],["Owner dashboard","Private internal asset"]]},analytics:{title:"Analytics",intro:"Cross-project completion and operational performance.",metrics:[["Portfolio progress","70%"],["Projects","4"],["Live systems","1"],["Build systems","3"]],rows:[["Operations Center","90%"],["FieldForged","75%"],["Crypto AI Signal Lab","65%"],["Chill Bro Wizard","50%"]]},alerts:{title:"Alerts",intro:"Items requiring owner attention.",metrics:[["Critical","0"],["Approvals","0"],["Follow-ups","6"],["System issues","0"]],rows:[["Dispatch update","Job CP-7821 assigned"],["Technician clock-in","Mike Johnson"],["Invoice paid","INV-5587"],["System update","All systems online"]]},settings:{title:"Settings",intro:"Private Command Center configuration.",metrics:[["Access","Owner only"],["Mobile","Official"],["Desktop","Official"],["Commercial UI","Separate"]],rows:[["Authentication","Not connected yet"],["Firebase","Not connected yet"],["GitHub","Connected account available"],["PWA install","Ready after hosting"]]},crypto:{title:"Crypto AI Signal Lab",intro:"Paper-execution environment and trading-system readiness.",metrics:[["Mode","Paper only"],["Exchange","Kraken planned"],["Live money","Disabled"],["Risk state","Protected"]],rows:[["Replay engine","Available"],["Signal monitoring","In development"],["API keys","Not connected"],["Live execution","Blocked until owner approval"]]}};
const projects=[{type:"BUSINESS OPERATIONS",name:"Chill Pros Operations Center",status:"ONLINE",progress:90,summary:"Dispatch, jobs, technicians, customers, service workflows and owner oversight."},{type:"COMMERCIAL SOFTWARE",name:"FieldForged Platform",status:"BUILDING",progress:75,summary:"ADI, parts intelligence, procurement, asset management and white-label commercial products."},{type:"FINANCIAL TECHNOLOGY",name:"Crypto AI Signal Lab",status:"PAPER ONLY",progress:65,summary:"Signal monitoring, replay testing, risk controls and Kraken integration preparation."},{type:"AI PRODUCT",name:"Chill Bro Wizard",status:"PROTOTYPE",progress:50,summary:"Voice-capable diagnostic and parts assistant for skilled-trade industries."}];
const drawer=document.getElementById("drawer"),backdrop=document.getElementById("backdrop"),title=document.getElementById("drawerTitle"),content=document.getElementById("drawerContent"),toast=document.getElementById("toast");let timer;
function notify(msg){toast.textContent=msg;toast.classList.add("show");clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove("show"),1400)}
function renderProjects(){content.innerHTML=`<section class="hero"><h2>Owner Portfolio</h2><p>All personal ventures and commercial products, controlled from one private dashboard.</p></section><div class="tabs"><button class="active" data-filter="all">All</button><button data-filter="operations">Operations</button><button data-filter="software">Software</button><button data-filter="ai">AI</button></div><div id="projectList"></div>`;const list=document.getElementById("projectList");const draw=(filter="all")=>{list.innerHTML="";projects.filter(p=>filter==="all"||p.type.toLowerCase().includes(filter)).forEach(p=>{const el=document.createElement("article");el.className="project";el.innerHTML=`<div class="project-top"><div><div class="project-type">${p.type}</div><h3>${p.name}</h3></div><span class="badge">${p.status}</span></div><p>${p.summary}</p><div class="progress"><span style="--pct:${p.progress}%"></span></div><div class="project-foot"><span>${p.progress}% complete</span><button class="action">Open workspace</button></div>`;el.querySelector(".action").addEventListener("click",()=>notify(p.name+" selected"));list.appendChild(el)})};draw();content.querySelectorAll("[data-filter]").forEach(btn=>btn.addEventListener("click",()=>{content.querySelectorAll("[data-filter]").forEach(b=>b.classList.remove("active"));btn.classList.add("active");draw(btn.dataset.filter)}))}
function renderPanel(key){if(key==="projects"){renderProjects();return}const d=data[key]||data.dashboard;content.innerHTML=`<section class="hero"><h2>${d.title}</h2><p>${d.intro}</p></section><section class="metrics">${d.metrics.map(m=>`<article class="metric"><div class="label">${m[0]}</div><div class="value">${m[1]}</div></article>`).join("")}</section><section class="section"><h3>Current overview</h3>${d.rows.map(r=>`<div class="row"><div><div>${r[0]}</div><div class="sub">Owner dashboard data</div></div><div class="right">${r[1]}</div></div>`).join("")}</section><section class="section"><h3>Actions</h3><div class="row"><div><div>Refresh overview</div><div class="sub">Update this panel</div></div><button class="action" id="refreshAction">Refresh</button></div><div class="row"><div><div>Open detailed workspace</div><div class="sub">Launch the full module</div></div><button class="action" id="openAction">Open</button></div></section>`;document.getElementById("refreshAction").addEventListener("click",()=>notify(d.title+" refreshed"));document.getElementById("openAction").addEventListener("click",()=>notify(d.title+" workspace selected"))}
function openDrawer(key){const d=key==="projects"?{title:"Projects"}:(data[key]||data.dashboard);title.textContent=d.title;renderPanel(key);drawer.classList.add("open");backdrop.classList.add("open");drawer.setAttribute("aria-hidden","false");document.body.style.overflow="hidden"}
function closeDrawer(){drawer.classList.remove("open");backdrop.classList.remove("open");drawer.setAttribute("aria-hidden","true");document.body.style.overflow=""}
document.querySelectorAll("[data-panel]").forEach(btn=>btn.addEventListener("click",()=>openDrawer(btn.dataset.panel)));document.getElementById("closeBtn").addEventListener("click",closeDrawer);backdrop.addEventListener("click",closeDrawer);document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer()});
</script>
</body>
</html>
