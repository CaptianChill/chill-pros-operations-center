name: Canonical Payment Return Contract

on:
  pull_request:
  push:
    branches:
      - recovery/boodaflow-canonical-v0-proxy

jobs:
  payment-return-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify checkout return reconciles through canonical authenticated billing
        run: |
          node --check canonical-top-level.js
          node --check functions/native-ops.js
          node <<'EOF'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');

          const client = fs.readFileSync('canonical-top-level.js', 'utf8');
          const native = fs.readFileSync('functions/native-ops.js', 'utf8');
          const css = fs.readFileSync('canonical-overlay.css', 'utf8');

          assert.match(client, /async function reconcilePaymentReturn\(\)/, 'canonical client must own payment-return reconciliation');
          assert.match(client, /searchParams\.get\('payment'\)/, 'payment outcome must come from the checkout return URL');
          assert.match(client, /searchParams\.get\('session_id'\)/, 'Stripe checkout session id must come from the return URL');
          assert.match(client, /secure\(BILL, '\/payments\/status'/, 'payment return must reuse canonical authenticated native billing');
          assert.match(client, /checkoutSessionId: sessionId/, 'payment status lookup must use the returned Stripe session id');
          assert.match(client, /out\.checkoutSessionId \|\| ''\) !== sessionId/, 'client must fail closed on payment-session mismatch');
          assert.match(client, /invoiceId && verifiedInvoiceId && invoiceId !== verifiedInvoiceId/, 'client must fail closed on invoice mismatch');
          assert.match(client, /paymentStatus === 'paid'/, 'paid checkout returns must be explicitly confirmed');
          assert.match(client, /checkoutStatus === 'complete'/, 'bank-payment processing returns must remain distinct from paid');
          assert.match(client, /history\.replaceState/, 'verified checkout return parameters must be cleared without navigation');
          assert.match(client, /void reconcilePaymentReturn\(\)/, 'reconciliation must run after the preserved v0 shell mounts');
          assert.doesNotMatch(client, /document\.body\.innerHTML|document\.body\s*=/, 'payment reconciliation must not reconstruct the document body');

          assert.match(native, /app\.post\("\/payments\/status", requireStaff/, 'native billing must expose authenticated payment status');
          assert.match(native, /session\.metadata\?\.invoiceId/, 'server must derive invoice identity from Stripe metadata');
          assert.match(native, /const paid = session\.payment_status === "paid"/, 'server must only mark paid from Stripe paid status');
          assert.match(css, /\.cp-payment-return\{/, 'payment outcome must use a scoped professional notice, not a replacement shell');

          console.log('Canonical payment return contract passed: checkout returns reconcile against Stripe through the same authenticated billing session without replacing the v0 UI.');
          EOF
