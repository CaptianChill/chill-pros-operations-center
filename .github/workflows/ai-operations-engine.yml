name: AI Operations Engine

on:
  pull_request:
    paths:
      - "ai/**"
      - "tests/ai-operations-engine.test.js"
      - "tests/ai-daily-operations-brief.test.js"
      - "tests/ai-dispatch-capacity-policy.test.js"
      - "tests/ai-approval-policy.test.js"
      - "firebase-config.js"
      - "docs/AI_OPERATIONS_ENGINE.md"
      - ".github/workflows/ai-operations-engine.yml"
  push:
    branches:
      - "feature/ai-operations-engine-foundation"
    paths:
      - "ai/**"
      - "tests/ai-operations-engine.test.js"
      - "tests/ai-daily-operations-brief.test.js"
      - "tests/ai-dispatch-capacity-policy.test.js"
      - "tests/ai-approval-policy.test.js"
      - "firebase-config.js"
      - "docs/AI_OPERATIONS_ENGINE.md"
      - ".github/workflows/ai-operations-engine.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check syntax
        run: |
          node --check ai/operations-engine.js
          node --check ai/daily-operations-brief.js
          node --check ai/dispatch-capacity-policy.js
          node --check ai/approval-policy.js
          node --check firebase-config.js
      - name: Run AI operations tests
        run: node --test tests/ai-operations-engine.test.js tests/ai-daily-operations-brief.test.js tests/ai-dispatch-capacity-policy.test.js tests/ai-approval-policy.test.js
