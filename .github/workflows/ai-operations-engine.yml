name: AI Operations Engine

on:
  pull_request:
    paths:
      - "ai/**"
      - "tests/ai-*.test.js"
      - "tests/fixtures/ai-operations-evaluation.json"
      - "firebase-config.js"
      - "docs/AI_OPERATIONS_ENGINE.md"
      - ".github/workflows/ai-operations-engine.yml"
  push:
    branches:
      - "feature/ai-operations-engine-foundation"
    paths:
      - "ai/**"
      - "tests/ai-*.test.js"
      - "tests/fixtures/ai-operations-evaluation.json"
      - "firebase-config.js"
      - "docs/AI_OPERATIONS_ENGINE.md"
      - ".github/workflows/ai-operations-engine.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check AI JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find ai -type f -name '*.js' -print0 | sort -z)

          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find tests -maxdepth 1 -type f -name 'ai-*.test.js' -print0 | sort -z)

          node --check firebase-config.js
      - name: Run AI operations tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' test_files < <(find tests -maxdepth 1 -type f -name 'ai-*.test.js' -print0 | sort -z)
          if (( ${#test_files[@]} == 0 )); then
            echo "No AI test files found." >&2
            exit 1
          fi
          node --test "${test_files[@]}"
