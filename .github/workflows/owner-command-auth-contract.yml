name: Owner Command Authorization Contract

on:
  pull_request:
    branches: [main]
    paths:
      - owner-command-auth.js
      - owner-command-auth-bootstrap.js
      - scripts/owner-command-auth.test.js
      - scripts/owner-command-auth-bootstrap.test.js
      - scripts/owner-command-auth-bootstrap-cleanup.test.js
      - scripts/owner-command-auth-signout.test.js
      - scripts/owner-command-auth-timer-cleanup.test.js
      - scripts/owner-command-auth-profile-accessor.test.js
      - scripts/owner-command-auth-profile-shape.test.js
      - scripts/owner-command-auth-session-race.test.js
      - .github/workflows/owner-command-auth-contract.yml
  push:
    branches:
      - security/issue-38-owner-command-auth
    paths:
      - owner-command-auth.js
      - owner-command-auth-bootstrap.js
      - scripts/owner-command-auth.test.js
      - scripts/owner-command-auth-bootstrap.test.js
      - scripts/owner-command-auth-bootstrap-cleanup.test.js
      - scripts/owner-command-auth-signout.test.js
      - scripts/owner-command-auth-timer-cleanup.test.js
      - scripts/owner-command-auth-profile-accessor.test.js
      - scripts/owner-command-auth-profile-shape.test.js
      - scripts/owner-command-auth-session-race.test.js
      - .github/workflows/owner-command-auth-contract.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-command-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check authorization module syntax
        run: node --check owner-command-auth.js
      - name: Check bootstrap module syntax
        run: node --check owner-command-auth-bootstrap.js
      - name: Check contract test syntax
        run: node --check scripts/owner-command-auth.test.js
      - name: Check bootstrap test syntax
        run: node --check scripts/owner-command-auth-bootstrap.test.js
      - name: Check bootstrap cleanup failure test syntax
        run: node --check scripts/owner-command-auth-bootstrap-cleanup.test.js
      - name: Check sign-out failure test syntax
        run: node --check scripts/owner-command-auth-signout.test.js
      - name: Check timer cleanup failure test syntax
        run: node --check scripts/owner-command-auth-timer-cleanup.test.js
      - name: Check profile accessor failure test syntax
        run: node --check scripts/owner-command-auth-profile-accessor.test.js
      - name: Check profile-shape test syntax
        run: node --check scripts/owner-command-auth-profile-shape.test.js
      - name: Check session-race test syntax
        run: node --check scripts/owner-command-auth-session-race.test.js
      - name: Run authorization contract
        run: node scripts/owner-command-auth.test.js
      - name: Run bootstrap contract
        run: node scripts/owner-command-auth-bootstrap.test.js
      - name: Run bootstrap cleanup failure contract
        run: node scripts/owner-command-auth-bootstrap-cleanup.test.js
      - name: Run sign-out failure contract
        run: node scripts/owner-command-auth-signout.test.js
      - name: Run timer cleanup failure contract
        run: node scripts/owner-command-auth-timer-cleanup.test.js
      - name: Run profile accessor failure contract
        run: node scripts/owner-command-auth-profile-accessor.test.js
      - name: Run strict profile-shape contract
        run: node scripts/owner-command-auth-profile-shape.test.js
      - name: Run session-race contract
        run: node scripts/owner-command-auth-session-race.test.js
