name: Owner Command Authorization Contract

on:
  pull_request:
    branches: [main]
    paths:
      - owner-command-auth.js
      - scripts/owner-command-auth.test.js
      - .github/workflows/owner-command-auth-contract.yml
  push:
    branches:
      - security/issue-38-owner-command-auth
    paths:
      - owner-command-auth.js
      - scripts/owner-command-auth.test.js
      - .github/workflows/owner-command-auth-contract.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-command-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check authorization module syntax
        run: node --check owner-command-auth.js
      - name: Check contract test syntax
        run: node --check scripts/owner-command-auth.test.js
      - name: Run authorization contract
        run: node scripts/owner-command-auth.test.js
