name: Technician Sign-In Contract

on:
  pull_request:
    paths:
      - "technician.html"
      - "auth-diagnostics.js"
      - "v1-access.js"
      - "scripts/check_technician_signin.py"
      - ".github/workflows/technician-signin-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate technician sign-in route and authorization boundary
        run: python scripts/check_technician_signin.py
