name: Firestore Role Permissions

on:
  pull_request:
    paths:
      - "firestore.rules"
      - "firebase.emulator.json"
      - "scripts/firestore-role-permissions-contract.js"
      - "scripts/firestore-role-permissions-emulator.test.js"
      - ".github/workflows/firestore-role-permissions.yml"
  push:
    branches:
      - "security/issue-34-role-permissions"
    paths:
      - "firestore.rules"
      - "firebase.emulator.json"
      - "scripts/firestore-role-permissions-contract.js"
      - "scripts/firestore-role-permissions-emulator.test.js"
      - ".github/workflows/firestore-role-permissions.yml"

permissions:
  contents: read

jobs:
  role-permissions-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check contract syntax
        run: node --check scripts/firestore-role-permissions-contract.js
      - name: Validate Firestore role permissions
        run: node scripts/firestore-role-permissions-contract.js

  role-permissions-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install emulator test dependencies
        run: npm install --no-save firebase@12.1.0 @firebase/rules-unit-testing@5.0.0 firebase-tools@14.12.0
      - name: Check emulator test syntax
        run: node --check scripts/firestore-role-permissions-emulator.test.js
      - name: Run Firestore emulator permission matrix
        run: npx firebase emulators:exec --only firestore --project demo-chill-pros-role-permissions --config firebase.emulator.json "node scripts/firestore-role-permissions-emulator.test.js"
