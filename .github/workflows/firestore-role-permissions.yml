name: Firestore Role Permissions

on:
  pull_request:
    paths:
      - "firestore.rules"
      - "firebase.emulator.json"
      - "audit-events.js"
      - "audited-customer-mutations.js"
      - "scripts/audit-events.test.js"
      - "scripts/audited-customer-mutations.test.js"
      - "scripts/firestore-role-permissions-contract.js"
      - "scripts/firestore-role-permissions-emulator.test.js"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "functions/scripts/inventory-private-customer-data.js"
      - "functions/scripts/inventory-private-customer-data.test.js"
      - ".github/workflows/firestore-role-permissions.yml"
  push:
    branches:
      - "security/issue-34-role-permissions"
    paths:
      - "firestore.rules"
      - "firebase.emulator.json"
      - "audit-events.js"
      - "audited-customer-mutations.js"
      - "scripts/audit-events.test.js"
      - "scripts/audited-customer-mutations.test.js"
      - "scripts/firestore-role-permissions-contract.js"
      - "scripts/firestore-role-permissions-emulator.test.js"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "functions/scripts/inventory-private-customer-data.js"
      - "functions/scripts/inventory-private-customer-data.test.js"
      - ".github/workflows/firestore-role-permissions.yml"

permissions:
  contents: read

jobs:
  role-permissions-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check contract syntax
        run: node --check scripts/firestore-role-permissions-contract.js
      - name: Validate Firestore role permissions
        run: node scripts/firestore-role-permissions-contract.js
      - name: Check audit event client syntax
        run: node --check audit-events.js
      - name: Test authenticated audit event client
        run: node scripts/audit-events.test.js
      - name: Check audited mutation client syntax
        run: node --check audited-customer-mutations.js
      - name: Test atomic audited customer mutations
        run: node scripts/audited-customer-mutations.test.js

  private-data-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend dependencies
        run: npm --prefix functions install --no-audit --no-fund
      - name: Check inventory utility syntax
        run: node --check functions/scripts/inventory-private-customer-data.js
      - name: Test private-data inventory helpers
        run: npm --prefix functions run test:private-data-inventory

  role-permissions-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install emulator test dependencies
        run: npm install --no-save firebase@12.1.0 @firebase/rules-unit-testing@5.0.0 firebase-tools@14.12.0
      - name: Check emulator test syntax
        run: node --check scripts/firestore-role-permissions-emulator.test.js
      - name: Run Firestore emulator permission matrix
        run: npx firebase emulators:exec --only firestore --project demo-chill-pros-role-permissions --config firebase.emulator.json "node scripts/firestore-role-permissions-emulator.test.js"
