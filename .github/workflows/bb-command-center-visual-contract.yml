name: BB Command Center Visual Contract

on:
  pull_request:
    paths:
      - "owner-command-center.html"
      - "owner-command-center.css"
      - "owner-command-center.js"
      - "bb-command-center.webmanifest"
      - "assets/bb-command-center-logo.svg"
      - "scripts/check_bb_command_center_visual_contract.py"
      - ".github/workflows/bb-command-center-visual-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check command-center JavaScript syntax
        run: node --check owner-command-center.js
      - name: Validate BB Command Center structure
        run: python3 scripts/check_bb_command_center_visual_contract.py
