name: Chill Bro Session Isolation Contract

on:
  pull_request:
  push:
    branches:
      - recovery/boodaflow-canonical-v0-proxy

jobs:
  chill-bro-session-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Keep Chill Bro conversation IDs bound to the authenticated user
        run: |
          node <<'EOF'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const vm = require('node:vm');

          const source = fs.readFileSync('canonical-chill-bro-session.js', 'utf8');
          const visual = fs.readFileSync('api/v0-visual.js', 'utf8');
          assert.match(visual, /canonical-chill-bro-session\.js/, 'visual proxy must load the session isolation guard');
          assert.doesNotMatch(source, /document\.|document\.body|innerHTML/, 'session isolation must never reconstruct or mutate the v0 shell');

          global.window = globalThis;
          let currentUser = { uid: 'user-a' };
          let authListener = null;
          global.chillProsAuth = {
            get currentUser() { return currentUser; },
            onAuthStateChanged(fn) { authListener = fn; queueMicrotask(() => fn(currentUser)); return () => {}; },
          };

          const token = (uid) => `e30.${Buffer.from(JSON.stringify({ exp: 4102444800, user_id: uid, sub: uid })).toString('base64url')}.sig`;
          const calls = [];
          global.fetch = async (input, init = {}) => {
            const url = typeof input === 'string' ? input : input.url;
            const body = typeof init.body === 'string' ? JSON.parse(init.body) : null;
            calls.push({ url, body, authorization: new Headers(init.headers).get('authorization') || '' });
            const uid = currentUser?.uid || 'none';
            return new Response(JSON.stringify({ ok: true, sessionId: `${uid}-session`, answer: 'ok' }), {
              status: 200,
              headers: { 'content-type': 'application/json' },
            });
          };

          vm.runInThisContext(source, { filename: 'canonical-chill-bro-session.js' });

          (async () => {
            const chat = 'https://us-central1-chill-pros-ice-stream.cloudfunctions.net/chillBroApi/chat';

            await fetch(chat, {
              method: 'POST',
              headers: { Authorization: `Bearer ${token('user-a')}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ message: 'first' }),
            });
            assert.equal(calls.at(-1).body.sessionId, undefined, 'new conversation should begin without a client-supplied session');

            await fetch(chat, {
              method: 'POST',
              headers: { Authorization: `Bearer ${token('user-a')}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ message: 'continue', sessionId: 'user-a-session' }),
            });
            assert.equal(calls.at(-1).body.sessionId, 'user-a-session', 'same authenticated user may continue a session issued to that user');

            currentUser = { uid: 'user-b' };
            authListener(currentUser);
            await fetch(chat, {
              method: 'POST',
              headers: { Authorization: `Bearer ${token('user-b')}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ message: 'switch account', sessionId: 'user-a-session' }),
            });
            assert.equal(calls.at(-1).body.sessionId, undefined, 'session ID from the previous authenticated user must be stripped after an account change');

            await fetch(chat, {
              method: 'POST',
              headers: { Authorization: `Bearer ${token('user-b')}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ message: 'continue b', sessionId: 'user-b-session' }),
            });
            assert.equal(calls.at(-1).body.sessionId, 'user-b-session', 'new authenticated user may continue only the session issued after the switch');

            const before = calls.length;
            await fetch('https://example.com/not-chill-bro', { method: 'POST', body: '{}' });
            assert.equal(calls.length, before + 1, 'unrelated requests must pass through exactly once');

            console.log('Chill Bro session isolation contract passed: conversation IDs cannot bleed across canonical authenticated identities.');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          EOF
