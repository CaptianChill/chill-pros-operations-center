name: Chill Bro Backend Contract

on:
  pull_request:
    paths:
      - 'functions/**'
      - '.github/workflows/chill-bro-functions-check.yml'
  push:
    branches:
      - feature/chill-bro-2
    paths:
      - 'functions/**'
      - '.github/workflows/chill-bro-functions-check.yml'

permissions:
  contents: read

jobs:
  backend-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: |
          node --check functions/main.js
          node --check functions/chill-bro.js
          node --check functions/native-ops.js
          node --check functions/index.js
      - name: Verify Firebase entrypoint exports native services
        run: |
          grep -q 'require("./chill-bro")' functions/main.js
          grep -q 'require("./native-ops")' functions/main.js
      - name: Keep Chill Bro runtime independent of Jobber
        run: |
          if grep -Eqi 'jobber|JOBBER_' functions/chill-bro.js functions/native-ops.js; then
            echo 'Jobber dependency detected in Chill Bro/native ops runtime.' >&2
            exit 1
          fi
      - name: Verify server-side secret bindings
        run: |
          grep -q 'defineSecret("OPENAI_API_KEY")' functions/chill-bro.js
          grep -q 'defineSecret("STRIPE_SECRET_KEY")' functions/native-ops.js
