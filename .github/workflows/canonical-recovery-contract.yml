name: Canonical Recovery Contract

on:
  pull_request:
  push:
    branches:
      - recovery/boodaflow-canonical-v0-proxy

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check canonical-auth.js
          node --check canonical-top-level.js
          node --check api/v0-visual.js
      - name: Enforce top-level approved UI path
        run: |
          test -f vercel.json
          grep -q '"src": "^/$"' vercel.json
          grep -q '"dest": "/api/v0-visual"' vercel.json
          grep -q 'canonical-overlay.css' api/v0-visual.js
          grep -q 'canonical-auth.js' api/v0-visual.js
          grep -q 'canonical-top-level.js' api/v0-visual.js
          ! grep -q 'canonical-frame' canonical-top-level.js
          ! grep -q 'document.body.innerHTML' canonical-top-level.js
          ! grep -q 'renderLogin' canonical-top-level.js
      - name: Block legacy competing runtimes
        run: |
          ! grep -q 'v2-final-runtime.js' api/v0-visual.js
          ! grep -q 'auth-guard.js' api/v0-visual.js
          ! grep -q 'firebase-auth-compat.js' api/v0-visual.js
          ! grep -q 'ionos-receptionist' api/v0-visual.js
          ! grep -q 'firebase.auth(' canonical-top-level.js
      - name: Verify exact v0 visual contract
        run: |
          grep -q 'chill-pros-operation-ceneter-v2.vercel.app' api/v0-visual.js
          grep -q 'dpl_FUSXSKKJ2USpEMMf4q1nCQR6qQ3T' api/v0-visual.js
          grep -q 'top-level-v0' api/v0-visual.js
      - name: Live-test preserved v0 output
        run: |
          node --input-type=module <<'EOF'
          import handler from './api/v0-visual.js';
          let statusCode = 0;
          let body = '';
          const headers = {};
          const res = {
            setHeader(key, value) { headers[String(key).toLowerCase()] = String(value); },
            status(code) { statusCode = code; return this; },
            send(value) { body = String(value); return this; },
          };
          await handler({}, res);
          if (statusCode !== 200) throw new Error(`proxy returned ${statusCode}`);
          if (!body.includes('class="app-shell"')) throw new Error('approved app-shell missing');
          if (!body.includes('chill-pros-command-center.png')) throw new Error('approved branding missing');
          if (!body.includes('Today') || !body.includes('Chill Bro') || !body.includes('Quotes')) throw new Error('required v0 landmarks missing');
          if (!body.includes('/canonical-top-level.js')) throw new Error('secure overlay runtime missing');
          if (!body.includes('/canonical-overlay.css')) throw new Error('scoped overlay CSS missing');
          if (headers['x-chill-pros-visual-source'] !== 'dpl_FUSXSKKJ2USpEMMf4q1nCQR6qQ3T') throw new Error('visual source marker mismatch');
          if (headers['x-chill-pros-render-mode'] !== 'top-level-v0') throw new Error('top-level render marker mismatch');
          console.log('Exact preserved v0 shell is top-level and canonical overlays are injected.');
          EOF
      - name: Verify live backend endpoints exist
        run: |
          chill_status=$(curl -sS -o /tmp/chill-health -w '%{http_code}' https://us-central1-chill-pros-ice-stream.cloudfunctions.net/chillBroApi/health || true)
          ops_status=$(curl -sS -o /tmp/ops-health -w '%{http_code}' https://us-central1-chill-pros-ice-stream.cloudfunctions.net/nativeOpsApi/health || true)
          test "$chill_status" = "401"
          test "$ops_status" = "401"
          grep -q 'Authentication required' /tmp/chill-health
          grep -q 'Authentication required' /tmp/ops-health
      - name: Verify revenue and Chill Bro paths
        run: |
          grep -q 'nativeOpsApi' canonical-top-level.js
          grep -q "'/quotes'" canonical-top-level.js
          grep -q "'/invoices'" canonical-top-level.js
          grep -q "'/payments/checkout'" canonical-top-level.js
          grep -q 'chillBroApi' canonical-top-level.js
          grep -q 'window.chillProsAuth' canonical-top-level.js
          grep -q 'chill-bro-approved.webp' canonical-top-level.js
