name: RC1 Checks

on:
  pull_request:
  push:
    branches:
      - main
      - rc1-production-readiness

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check firebase-config.js
          node --check v1-access.js
          node --check production-reset.js
          node --check functions/index.js
          node --check scripts/rc1-smoke-test.js
          node --check scripts/runtime-bootstrap-test.js
          node --check scripts/firestore-security-test.js

      - name: Run RC1 smoke checks
        run: node scripts/rc1-smoke-test.js

      - name: Verify shared runtime access controls
        run: node scripts/runtime-bootstrap-test.js

      - name: Verify Firestore technician isolation
        run: node scripts/firestore-security-test.js

      - name: Validate Firebase Functions dependencies
        working-directory: functions
        run: npm install --package-lock=false --ignore-scripts
