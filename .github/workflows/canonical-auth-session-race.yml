name: Canonical Auth Session Race

on:
  pull_request:
  push:
    branches:
      - recovery/boodaflow-canonical-v0-proxy

jobs:
  auth-session-race:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prevent stale refresh from reviving or clearing a newer session
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import vm from 'node:vm';
          import assert from 'node:assert/strict';

          const source = fs.readFileSync('canonical-auth.js', 'utf8');
          assert.doesNotMatch(source, /document\.|document\.body|innerHTML/, 'canonical auth must remain DOM-free');

          function token(exp) {
            return `e30.${Buffer.from(JSON.stringify({ exp })).toString('base64url')}.sig`;
          }

          async function runScenario(refreshMode) {
            const store = new Map();
            store.set('chillProsCanonicalSession', JSON.stringify({
              idToken: token(1),
              refreshToken: 'old-refresh',
              email: 'old@chillpros.test',
              localId: 'old-owner',
            }));

            let releaseRefresh;
            let refreshStarted;
            const refreshStartedPromise = new Promise(resolve => { refreshStarted = resolve; });

            const sandbox = {
              window: null,
              localStorage: {
                getItem(key) { return store.has(key) ? store.get(key) : null; },
                setItem(key, value) { store.set(key, String(value)); },
                removeItem(key) { store.delete(key); },
              },
              fetch: async (url) => {
                if (String(url).includes('securetoken.googleapis.com')) {
                  refreshStarted();
                  return await new Promise(resolve => {
                    releaseRefresh = () => resolve(
                      refreshMode === 'success'
                        ? new Response(JSON.stringify({ id_token: token(4102444800), refresh_token: 'old-refresh-rotated', user_id: 'old-owner' }), {
                            status: 200,
                            headers: { 'content-type': 'application/json' },
                          })
                        : new Response(JSON.stringify({ error: { message: 'INVALID_REFRESH_TOKEN' } }), {
                            status: 400,
                            headers: { 'content-type': 'application/json' },
                          })
                    );
                  });
                }
                if (String(url).includes('identitytoolkit.googleapis.com')) {
                  return new Response(JSON.stringify({
                    idToken: token(4102444800),
                    refreshToken: 'new-refresh',
                    email: 'new@chillpros.test',
                    localId: 'new-owner',
                  }), {
                    status: 200,
                    headers: { 'content-type': 'application/json' },
                  });
                }
                throw new Error(`Unexpected auth request: ${url}`);
              },
              AbortController,
              URLSearchParams,
              Response,
              setTimeout,
              clearTimeout,
              queueMicrotask,
              atob: value => Buffer.from(value, 'base64').toString('binary'),
              console,
            };
            sandbox.window = sandbox;
            vm.createContext(sandbox);
            vm.runInContext(source, sandbox);

            const staleUser = sandbox.chillProsAuth.currentUser;
            assert.equal(staleUser?.email, 'old@chillpros.test');
            const staleRefresh = staleUser.getIdToken().then(
              value => ({ value }),
              error => ({ error })
            );
            await refreshStartedPromise;

            await sandbox.chillProsAuth.signOut();
            const signedIn = await sandbox.chillProsAuth.signInWithEmailAndPassword('new@chillpros.test', 'test-password');
            assert.equal(signedIn.user.email, 'new@chillpros.test');
            releaseRefresh();
            await staleRefresh;

            assert.equal(sandbox.chillProsAuth.currentUser?.email, 'new@chillpros.test', `stale ${refreshMode} refresh must not replace or clear newer sign-in`);
            const persisted = JSON.parse(store.get('chillProsCanonicalSession'));
            assert.equal(persisted.email, 'new@chillpros.test');
            assert.equal(persisted.localId, 'new-owner');
            assert.equal(persisted.refreshToken, 'new-refresh');
          }

          await runScenario('success');
          await runScenario('terminal-error');
          console.log('Canonical auth session race contract passed: stale refreshes cannot revive, overwrite, or clear a newer authenticated session.');
          EOF
