name: Chill Bro V3 Contract

on:
  pull_request:
    paths:
      - 'chill-bro-v3.js'
      - 'chill-bro-v3.css'
      - 'index.html'
      - 'api/**'
      - 'package.json'
      - 'functions/**'
      - 'docs/chill-bro-knowledge-sources.json'
      - '.github/workflows/chill-bro-v3-check.yml'
  push:
    branches:
      - feature/chill-bro-copilot-v3
    paths:
      - 'chill-bro-v3.js'
      - 'chill-bro-v3.css'
      - 'index.html'
      - 'api/**'
      - 'package.json'
      - 'functions/**'
      - 'docs/chill-bro-knowledge-sources.json'
      - '.github/workflows/chill-bro-v3-check.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: |
          node --check chill-bro-v3.js
          node --check api/chill-bro-research.js
          node --check functions/main.js
          node --check functions/chill-bro.js
      - name: Validate Vercel AI Gateway package
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node --input-type=module -e "import { gateway, generateText } from 'ai'; if (!generateText || !gateway?.tools?.exaSearch) process.exit(1)"
      - name: JSON source registry
        run: node -e "JSON.parse(require('fs').readFileSync('docs/chill-bro-knowledge-sources.json','utf8'))"
      - name: Keep private source identifiers out of public repo
        run: |
          if grep -Eqi 'source_id|drive\.google\.com|docs\.google\.com' docs/chill-bro-knowledge-sources.json; then
            echo 'Private document identifiers or Drive URLs detected in public source registry.' >&2
            exit 1
          fi
      - name: Verify employee-only backend export
        run: |
          grep -q 'require("./chill-bro")' functions/main.js
          grep -q 'Chill Pros team access required' functions/chill-bro.js
          grep -q 'employeeOnly: true' functions/chill-bro.js
      - name: Verify BoodaFlow and private knowledge hooks
        run: |
          grep -q 'BoodaFlow operating process' functions/chill-bro.js
          grep -q 'type: "web_search"' functions/chill-bro.js
          grep -q 'type: "file_search"' functions/chill-bro.js
          grep -q 'gpt-5.6-luna' functions/chill-bro.js
          grep -q 'gpt-5.6-terra' functions/chill-bro.js
      - name: Verify hybrid live research route
        run: |
          grep -q 'gateway.tools.exaSearch' api/chill-bro-research.js
          grep -q 'openai/gpt-5.6-terra' api/chill-bro-research.js
          grep -q 'disallowPromptTraining: true' api/chill-bro-research.js
          grep -q 'RESEARCH_API = "/api/chill-bro-research"' chill-bro-v3.js
      - name: Verify customer IONOS widget is not loaded
        run: |
          if grep -q 'ionos-receptionist.js' index.html; then
            echo 'Customer/receptionist widget is still loaded in employee app entrypoint.' >&2
            exit 1
          fi
      - name: Probe deployed Chill Bro endpoint
        shell: bash
        run: |
          set -euo pipefail
          url='https://us-central1-chill-pros-ice-stream.cloudfunctions.net/chillBroApi/health'
          code="$(curl -sS -o /tmp/chill-bro-health.txt -w '%{http_code}' --connect-timeout 10 --max-time 20 "$url" || true)"
          echo "Chill Bro health probe HTTP $code"
          cat /tmp/chill-bro-health.txt 2>/dev/null || true
          if [[ "$code" != "401" && "$code" != "403" && "$code" != "200" ]]; then
            echo "Expected deployed Chill Bro endpoint to answer 200/401/403; got $code." >&2
            exit 1
          fi
