name: Mobile Preview Assets

on:
  pull_request:
    paths:
      - 'iphone.html'
      - 'iphone*.css'
      - 'scripts/check-mobile-preview-assets.mjs'
      - '.github/workflows/mobile-preview-assets.yml'
  push:
    branches:
      - feature/mobile-ui-polish
    paths:
      - 'iphone.html'
      - 'iphone*.css'
      - 'scripts/check-mobile-preview-assets.mjs'
      - '.github/workflows/mobile-preview-assets.yml'

permissions:
  contents: read

jobs:
  preview-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate preview asset script syntax
        run: node --check scripts/check-mobile-preview-assets.mjs

      - name: Verify mobile preview assets
        run: node scripts/check-mobile-preview-assets.mjs
