name: Chill Bro Canonical Contract

on:
  pull_request:
  push:
    branches:
      - main
      - recovery/boodaflow-canonical-v0-proxy

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical server source exists
        run: |
          test -f functions/chill-bro.js
          test -f functions/native-ops.js
          grep -q 'require("./chill-bro")' functions/main.js
          grep -q 'require("./native-ops")' functions/main.js
          grep -q 'chillBroApi' functions/chill-bro.js
          grep -q 'nativeOpsApi' functions/native-ops.js
      - name: Verify top-level frontend integration
        run: |
          test -f canonical-auth.js
          test -f canonical-top-level.js
          test -f canonical-overlay.css
          test -f api/v0-visual.js
          test -f vercel.json
          ! test -f canonical-runtime.js
          ! test -f canonical-shell.css
          grep -q 'canonical-auth.js' api/v0-visual.js
          grep -q 'canonical-top-level.js' api/v0-visual.js
          grep -q 'canonical-overlay.css' api/v0-visual.js
          grep -q '"dest": "/api/v0-visual"' vercel.json
      - name: Block shell and competing auth regressions
        run: |
          if grep -RniE 'ionos-receptionist|IONOS connection pending|document\.body\.innerHTML|canonical-frame|renderLogin' canonical-auth.js canonical-top-level.js api/v0-visual.js 2>/dev/null; then
            echo "Recovery shell or competing runtime pattern found"
            exit 1
          fi
          if grep -qE 'firebase\.auth\(' canonical-top-level.js; then
            echo "Canonical runtime must consume chillProsAuth rather than a second auth client"
            exit 1
          fi
      - name: Verify one authenticated token source
        run: |
          grep -q 'window.chillProsAuth' canonical-auth.js
          grep -q 'window.chillProsAuth' canonical-top-level.js
          grep -q 'getIdToken' canonical-top-level.js
      - name: Verify immutable v0 visual source
        run: |
          grep -q 'chill-pros-operation-ceneter-v2-qv0by9k5v-chill-pros.vercel.app' api/v0-visual.js
          grep -q 'dpl_FUSXSKKJ2USpEMMf4q1nCQR6qQ3T' api/v0-visual.js
          grep -q 'top-level-v0' api/v0-visual.js
      - name: Verify mobile release protections and exact v0 controls
        run: |
          grep -q 'font-size:16px' canonical-overlay.css
          grep -q '@media(max-width:800px)' canonical-overlay.css
          grep -q '100dvh' canonical-overlay.css
          ! grep -q 'cpChillBroLauncher' canonical-top-level.js
          grep -q 'AI Parts Intelligence' canonical-top-level.js
          grep -q 'Chill Bro' canonical-top-level.js
      - name: Verify revenue and Chill Bro paths
        run: |
          grep -q 'nativeOpsApi' canonical-top-level.js
          grep -q "'/quotes'" canonical-top-level.js
          grep -q "'/invoices'" canonical-top-level.js
          grep -q "'/payments/checkout'" canonical-top-level.js
          grep -q 'chillBroApi' canonical-top-level.js
          grep -q 'chill-bro-approved.webp' canonical-top-level.js
