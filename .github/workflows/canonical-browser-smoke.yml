name: Canonical Browser Smoke

on:
  pull_request:
  push:
    branches:
      - recovery/boodaflow-canonical-v0-proxy

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install browser test runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start canonical v0 composition server
        run: |
          cat > /tmp/cp-browser-server.mjs <<'EOF'
          import http from 'node:http';
          import fs from 'node:fs';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          const root = process.cwd();
          const { default: visualHandler } = await import(pathToFileURL(path.join(root, 'api/v0-visual.js')).href);
          const types = {
            '.js': 'application/javascript; charset=utf-8',
            '.css': 'text/css; charset=utf-8',
            '.html': 'text/html; charset=utf-8',
            '.json': 'application/json; charset=utf-8',
            '.webp': 'image/webp',
            '.png': 'image/png',
            '.jpg': 'image/jpeg',
            '.jpeg': 'image/jpeg',
            '.svg': 'image/svg+xml',
            '.webmanifest': 'application/manifest+json; charset=utf-8',
          };

          const server = http.createServer(async (req, res) => {
            const url = new URL(req.url || '/', 'http://127.0.0.1:4173');
            if (url.pathname === '/') {
              const adapter = {
                setHeader(name, value) { res.setHeader(name, value); },
                status(code) { res.statusCode = code; return this; },
                send(value) { res.end(String(value)); return this; },
              };
              await visualHandler(req, adapter);
              return;
            }

            let requested;
            try { requested = decodeURIComponent(url.pathname); } catch { res.statusCode = 400; res.end('Bad request'); return; }
            const relative = requested.replace(/^\/+/, '');
            const candidate = path.resolve(root, relative);
            if (!candidate.startsWith(root + path.sep)) { res.statusCode = 403; res.end('Forbidden'); return; }
            if (fs.existsSync(candidate) && fs.statSync(candidate).isFile()) {
              res.setHeader('content-type', types[path.extname(candidate).toLowerCase()] || 'application/octet-stream');
              fs.createReadStream(candidate).pipe(res);
              return;
            }
            res.statusCode = 404;
            res.end('Not found');
          });

          server.listen(4173, '127.0.0.1', () => console.log('canonical browser server listening on 4173'));
          EOF

          node /tmp/cp-browser-server.mjs > /tmp/cp-browser-server.log 2>&1 &
          echo $! > /tmp/cp-browser-server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cp-browser-server.log
          exit 1

      - name: Exercise desktop and mobile in Chromium
        run: |
          cat > ./cp-browser-smoke.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const browserErrors = [];

          async function waitForCanonical(page) {
            page.on('pageerror', error => browserErrors.push(`pageerror: ${error.message}`));
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 90000 });
            await page.waitForSelector('.app-shell', { state: 'visible', timeout: 30000 });
            await page.waitForFunction(() => document.documentElement.dataset.cpCanonicalTopLevel === '1', null, { timeout: 30000 });
            await page.waitForTimeout(1500);
            assert.equal(await page.locator('.app-shell').count(), 1, 'approved app shell must remain mounted after hydration');
            assert.equal(await page.locator('#appRoot').count(), 0, 'recovery appRoot shell must not exist');
            assert.equal(await page.locator('.cp-login').count(), 0, 'full-screen recovery login must not exist');
            assert.equal(await page.locator('#cpChillBroLauncher').count(), 0, 'recovery must not inject a floating Chill Bro launcher');
          }

          const desktop = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
          const page = await desktop.newPage();
          await waitForCanonical(page);
          await page.screenshot({ path: 'canonical-desktop.png', fullPage: true });

          const fakeToken = `e30.${Buffer.from(JSON.stringify({ exp: 4102444800 })).toString('base64url')}.sig`;
          const secureCalls = [];

          await page.route(/identitytoolkit\.googleapis\.com\/v1\/accounts:signInWithPassword/, async route => {
            await route.fulfill({
              status: 200,
              contentType: 'application/json',
              body: JSON.stringify({
                idToken: fakeToken,
                refreshToken: 'smoke-refresh-token',
                email: 'smoke@chillpros.test',
                localId: 'smoke-owner',
              }),
            });
          });

          await page.route(/us-central1-chill-pros-ice-stream\.cloudfunctions\.net\/(nativeOpsApi|chillBroApi)\//, async route => {
            const request = route.request();
            const url = new URL(request.url());
            const auth = request.headers().authorization || '';
            secureCalls.push({ pathname: url.pathname, auth });

            let body = { ok: true };
            if (url.pathname === '/nativeOpsApi/quotes') body = { id: 'q-smoke', total: 125 };
            else if (url.pathname === '/nativeOpsApi/quotes/q-smoke/approve') body = { ok: true };
            else if (url.pathname === '/nativeOpsApi/invoices') body = { id: 'i-smoke', total: 125 };
            else if (url.pathname === '/nativeOpsApi/invoices/i-smoke/approve') body = { ok: true };
            else if (url.pathname === '/nativeOpsApi/payments/checkout') body = { checkoutSessionId: 'cs-smoke' };
            else if (url.pathname === '/chillBroApi/chat') body = { sessionId: 'cb-smoke', answer: 'Smoke response from Chill Bro' };
            else throw new Error(`Unexpected secure smoke request: ${url.pathname}`);

            await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(body) });
          });

          await page.evaluate(() => {
            window.__cpClickProbe = [];
            const capture = (scope) => (event) => {
              const button = event.target?.closest?.('button');
              window.__cpClickProbe.push({ scope, tag: event.target?.tagName || '', buttonText: (button?.textContent || '').replace(/\s+/g, ' ').trim(), defaultPrevented: event.defaultPrevented });
            };
            window.addEventListener('click', capture('window'), true);
            document.addEventListener('click', capture('document'), true);
          });

          const quoteButton = page.locator('button').filter({ hasText: /^Quotes/ }).first();
          assert.equal(await quoteButton.count(), 1, 'desktop Quotes control must exist');
          await quoteButton.click();
          await page.waitForSelector('#cpQuoteOverlay', { state: 'visible' });
          assert.equal(await page.locator('.app-shell').count(), 1, 'quote overlay must not replace v0 app shell');

          await page.fill('#cqDescription', 'Browser smoke test service');
          await page.fill('#cqPrice', '125.00');
          await page.click('#cqSave');
          await page.waitForSelector('#cpCanonicalAuth', { state: 'visible' });
          assert.equal(await page.locator('#cpAuthForm input[name="email"]').count(), 1, 'secure action must use canonical auth modal');
          assert.equal(await page.evaluate(() => typeof window.chillProsAuth?.signInWithEmailAndPassword), 'function', 'canonical REST auth client must be loaded');

          await page.fill('#cpAuthForm input[name="email"]', 'smoke@chillpros.test');
          await page.fill('#cpAuthForm input[name="password"]', 'smoke-password');
          await page.click('#cpAuthButton');
          await page.waitForSelector('#cpCanonicalAuth', { state: 'detached' });
          await page.waitForFunction(() => document.querySelector('#cqStatus')?.textContent?.includes('Draft saved'));
          assert.equal(await page.evaluate(() => Boolean(window.chillProsAuth?.currentUser)), true, 'successful canonical sign-in must establish the shared session');
          assert.equal(await page.evaluate(() => Boolean(localStorage.getItem('chillProsCanonicalSession'))), true, 'canonical session must persist after sign-in');

          await page.click('#cqApprove');
          await page.waitForFunction(() => document.querySelector('#cqStatus')?.textContent === 'Quote approved.');
          await page.click('#cqInvoice');
          await page.waitForFunction(() => document.querySelector('#cqStatus')?.textContent?.includes('Invoice created'));
          await page.click('#cqApproveInvoice');
          await page.waitForFunction(() => document.querySelector('#cqStatus')?.textContent === 'Invoice approved.');
          await page.click('#cqPay');
          await page.waitForFunction(() => document.querySelector('#cqStatus')?.textContent === 'Secure card / ACH checkout created.');

          const billingCalls = secureCalls.filter(call => call.pathname.startsWith('/nativeOpsApi/'));
          assert.deepEqual(
            billingCalls.map(call => call.pathname),
            [
              '/nativeOpsApi/quotes',
              '/nativeOpsApi/quotes/q-smoke/approve',
              '/nativeOpsApi/invoices',
              '/nativeOpsApi/invoices/i-smoke/approve',
              '/nativeOpsApi/payments/checkout',
            ],
            'quote → approve → invoice → approve → checkout sequence must remain intact'
          );
          assert.ok(billingCalls.every(call => call.auth === `Bearer ${fakeToken}`), 'every billing request must use the canonical authenticated token');
          await page.locator('#cpQuoteOverlay .cp-overlay-close').click();

          const desktopChillBro = page.locator('button').filter({ hasText: /^AI Parts Intelligence$/ }).first();
          assert.equal(await desktopChillBro.count(), 1, 'desktop v0 AI Parts Intelligence control must exist');
          await desktopChillBro.click();
          await page.waitForSelector('#cpChillBroPanel.open', { state: 'visible' });
          await page.fill('#cbInput', 'Browser smoke test');
          await page.click('#cbSend');
          await page.waitForFunction(() => Array.from(document.querySelectorAll('#cbThread .cp-msg.bot')).some(node => node.textContent?.includes('Smoke response from Chill Bro')));
          assert.equal(await page.locator('#cpCanonicalAuth').count(), 0, 'Chill Bro must reuse the established auth session instead of asking for a second sign-in');

          const chillCalls = secureCalls.filter(call => call.pathname === '/chillBroApi/chat');
          assert.equal(chillCalls.length, 1, 'Chill Bro chat must issue one authenticated request');
          assert.equal(chillCalls[0].auth, `Bearer ${fakeToken}`, 'Chill Bro must use the exact same authenticated token as billing');
          assert.equal(await page.locator('.app-shell').count(), 1, 'Chill Bro must not replace v0 app shell');
          await page.locator('#cpChillBroPanel .cp-overlay-close').click();
          await desktop.close();

          const mobile = await browser.newContext({ viewport: { width: 393, height: 852 }, isMobile: true, hasTouch: true });
          const m = await mobile.newPage();
          await waitForCanonical(m);
          const mobileNav = m.locator('.mobile-nav');
          await mobileNav.waitFor({ state: 'visible', timeout: 15000 });
          for (const label of ['Today', 'Jobs', 'Intake', 'Chill Bro', 'Quote']) {
            assert.ok((await mobileNav.locator('button').allTextContents()).some(text => text.includes(label)), `mobile nav missing ${label}`);
          }
          await m.screenshot({ path: 'canonical-mobile.png', fullPage: true });
          await mobileNav.locator('button').filter({ hasText: 'Chill Bro' }).click();
          await m.waitForSelector('#cpChillBroPanel.open', { state: 'visible' });
          assert.equal(await m.locator('#cpChillBroLauncher').count(), 0, 'mobile must use preserved v0 Chill Bro control, not an injected launcher');
          await m.locator('#cpChillBroPanel .cp-overlay-close').click();
          await mobileNav.locator('button').filter({ hasText: 'Quote' }).click();
          await m.waitForSelector('#cpQuoteOverlay', { state: 'visible' });
          assert.equal(await m.locator('.app-shell').count(), 1, 'mobile quote must preserve v0 shell');
          await mobile.close();

          await browser.close();
          const hydrationErrors = browserErrors.filter(message => /hydration|Minified React error|removeChild|insertBefore|NotFoundError/i.test(message));
          assert.deepEqual(hydrationErrors, [], `hydration/browser errors detected:\n${hydrationErrors.join('\n')}`);
          console.log('Canonical v0 browser smoke passed: exact v0 UI, successful shared auth, full billing flow, Chill Bro same-session auth, desktop/mobile.');
          EOF

          node ./cp-browser-smoke.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-browser-evidence
          path: |
            canonical-desktop.png
            canonical-mobile.png
            /tmp/cp-browser-server.log
          if-no-files-found: warn
