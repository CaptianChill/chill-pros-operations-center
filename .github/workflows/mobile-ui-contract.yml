name: Mobile UI Contract

on:
  pull_request:
    paths:
      - "iphone.html"
      - "iphone.css"
      - "iphone-polish.css"
      - "iphone-finish.css"
      - "iphone-command.css"
      - "scripts/check-mobile-ui-contract.mjs"
      - ".github/workflows/mobile-ui-contract.yml"
  push:
    branches:
      - "feature/mobile-ui-polish"
    paths:
      - "iphone.html"
      - "iphone.css"
      - "iphone-polish.css"
      - "iphone-finish.css"
      - "iphone-command.css"
      - "scripts/check-mobile-ui-contract.mjs"
      - ".github/workflows/mobile-ui-contract.yml"

permissions:
  contents: read

jobs:
  presentation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check contract script syntax
        run: node --check scripts/check-mobile-ui-contract.mjs

      - name: Verify iPhone presentation contract
        run: node scripts/check-mobile-ui-contract.mjs
