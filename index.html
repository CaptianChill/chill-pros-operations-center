<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020204">
<title>Chill Pros Command Center</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chill Pros">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet">
<style>
:root{
  --void:#020204; --deck:rgba(6,10,20,.82); --panel:rgba(14,22,40,.62); --raised:rgba(28,42,70,.72);
  --line:rgba(127,212,245,.16); --line-hot:rgba(127,212,245,.36);
  --ice:#7FD4F5; --ice-deep:#38A9DC; --frost:#E9F4FB; --mute:#93AAC6;
  --amber:#F5A93F; --mint:#5FD9A4; --rose:#FF7A8A; --violet:#A98CF5;
  --r:10px; --rail:200px;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:'Titan One',var(--sans);
  --safeT:env(safe-area-inset-top,0px);
  --safeB:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;font-family:var(--sans);background:var(--void);color:var(--frost);
  font-size:15px;line-height:1.45;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{display:block;max-width:100%}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-hot);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px;border-radius:4px}

/* ── real background art ─────────────────────────── */
.bgwrap{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:#02040A url('/bg-space.jpg') center top/cover no-repeat}
.bgwrap::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(2,4,10,.62) 0%,rgba(2,4,10,.80) 45%,rgba(2,4,10,.93) 100%)}

/* ── icy display type, matched to the logo ───────── */
.icy-title{
  font-family:var(--display);font-weight:400;letter-spacing:.015em;
  background:linear-gradient(180deg,#FFFFFF 0%,#DCF4FF 30%,#7FD4F5 62%,#2C8FC4 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:.9px #041D2E;
  text-shadow:0 1px 0 rgba(4,29,46,.9),0 0 18px rgba(56,169,220,.45);
  line-height:1.18;
}

.shell{position:relative;z-index:1;display:grid;grid-template-columns:var(--rail) 1fr;height:100dvh}

.rail{
  background:linear-gradient(180deg,rgba(4,8,16,.92),rgba(1,2,5,.96));
  border-right:1px solid var(--line);backdrop-filter:blur(10px);
  display:flex;flex-direction:column;padding:calc(14px + var(--safeT)) 10px 10px;gap:2px;overflow-y:auto;
}
.mark{display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px 4px 16px;flex:none}
.mark img{width:100%;max-width:150px;height:auto;
  filter:drop-shadow(0 0 14px rgba(56,169,220,.5))}
.mark small{color:var(--mute);font-size:9px;letter-spacing:.16em;font-weight:800}
.navbtn{width:100%;padding:9px 10px;border-radius:9px;display:flex;align-items:center;gap:10px;
  color:var(--mute);transition:background .12s,color .12s;flex:none;text-align:left}
.navbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.navbtn span{font-size:12.5px;letter-spacing:.01em;font-weight:600}
.navbtn:hover{background:var(--panel);color:var(--frost)}
.navbtn[aria-current="page"]{background:var(--raised);color:var(--ice);box-shadow:inset 2px 0 0 var(--ice)}
.rail-sp{flex:1}

.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.top{display:flex;align-items:flex-end;gap:12px;flex:none;
  padding:calc(12px + var(--safeT)) 18px 12px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(3,6,14,.92),rgba(3,6,14,.72));
  backdrop-filter:blur(12px)}
.top h1{margin:0;font-size:21px;font-weight:400;letter-spacing:.015em}
.top .sub{color:var(--mute);font-size:12.5px;margin-top:3px}
.top-sp{flex:1}

.body{flex:1;overflow-y:auto;padding:18px 18px calc(96px + var(--safeB));min-height:0;-webkit-overflow-scrolling:touch}

.btn{padding:9px 15px;border-radius:9px;font-size:13.5px;font-weight:600;border:1px solid var(--line-hot);
  background:var(--raised);color:var(--frost);transition:border-color .12s,background .12s;white-space:nowrap}
.btn:hover{border-color:var(--ice-deep);background:rgba(40,62,100,.8)}
.btn.pri{background:linear-gradient(135deg,var(--ice),var(--ice-deep));color:#04121F;border-color:transparent;
  box-shadow:0 2px 14px rgba(56,169,220,.32)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.gho{background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}

.card{background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:16px;padding:16px;
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 8px 30px rgba(0,0,0,.35)}
.grid{display:grid;gap:14px}
.field{display:grid;gap:5px;margin-bottom:11px}
.field>label{font-size:12px;color:var(--mute);font-weight:600}
.inp{width:100%;padding:10px 12px;border-radius:9px;background:rgba(4,10,22,.75);
  border:1px solid var(--line);color:var(--frost);font-size:16px}
.inp:focus{outline:none;border-color:var(--ice-deep);background:rgba(6,14,30,.9)}
textarea.inp{resize:vertical;min-height:76px;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.muted{color:var(--mute);font-size:13px}
.empty{text-align:center;padding:48px 20px;color:var(--mute)}
.empty b{display:block;color:var(--frost);font-size:15px;margin-bottom:5px;font-weight:600}
.sechd{font-weight:800;font-size:12px;letter-spacing:.09em;color:var(--ice);margin-bottom:10px}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.02em}
.pill.hvac{background:rgba(127,212,245,.16);color:var(--ice)}
.pill.refrigeration{background:rgba(95,217,164,.16);color:var(--mint)}
.pill.ice{background:rgba(169,140,245,.18);color:var(--violet)}
.pill.kitchen{background:rgba(245,169,63,.17);color:var(--amber)}
.pill.pm{background:rgba(233,244,251,.12);color:var(--frost)}
.pill.p1{background:rgba(255,122,138,.18);color:var(--rose)}
.pill.p2{background:rgba(245,169,63,.17);color:var(--amber)}
.pill.p3{background:rgba(147,170,198,.17);color:var(--mute)}

.board{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:12px;align-items:start}
.col{background:rgba(10,18,34,.5);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:14px;padding:11px;min-height:120px}
.col>h3{margin:0 0 10px;font-size:11.5px;font-weight:800;letter-spacing:.07em;color:var(--mute);
  display:flex;align-items:center;gap:7px}
.col>h3 i{width:7px;height:7px;border-radius:99px;background:currentColor;font-style:normal}
.col.c-new>h3{color:var(--rose)} .col.c-dispatched>h3{color:var(--amber)}
.col.c-onsite>h3{color:var(--ice)} .col.c-complete>h3{color:var(--mint)}
.col>h3 b{margin-left:auto;font-weight:700;color:var(--frost);font-size:11px;background:var(--raised);padding:1px 7px;border-radius:99px}

.job{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line-hot);
  border-radius:11px;padding:11px;margin-bottom:9px;transition:border-color .12s,transform .12s}
.job:hover{border-color:var(--line-hot);transform:translateY(-1px)}
.job.p1{border-left-color:var(--rose)} .job.p2{border-left-color:var(--amber)} .job.p3{border-left-color:var(--line-hot)}
.job h4{margin:0 0 3px;font-size:14px;font-weight:650;letter-spacing:-.01em}
.job .site{color:var(--mute);font-size:12.5px;margin-bottom:8px}
.job .tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.job .acts{display:flex;gap:6px;flex-wrap:wrap}

.rows{display:grid;gap:8px}
.rw{display:flex;align-items:center;gap:12px;padding:12px 14px;background:rgba(255,255,255,.03);
  border:1px solid var(--line);border-radius:12px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.rw .g{flex:1;min-width:0}
.rw strong{display:block;font-size:14px;font-weight:620}
.rw .g small{color:var(--mute);font-size:12.5px}
.amt{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;white-space:nowrap}

/* label / price / control row — used by Parts and Care Plans */
.lrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(127,212,245,.1)}
.lrow:last-child{border-bottom:0}
.lrow .nm{flex:1;min-width:0;font-size:13.5px}
.lrow .pr{color:var(--mute);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.lrow .inp{width:66px;padding:6px 8px;font-size:15px;text-align:center;flex:none}
.lrow .btn{flex:none}

.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;padding:8px 10px;color:var(--mute);font-size:11.5px;font-weight:700;border-bottom:1px solid var(--line-hot)}
.tbl td{padding:9px 10px;border-bottom:1px solid rgba(127,212,245,.09)}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

.chk{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border-radius:11px;
  border:1px solid var(--line);background:var(--panel);margin-bottom:7px}
.chk input[type=checkbox]{width:20px;height:20px;accent-color:var(--ice-deep);margin-top:1px;flex:none}
.chk label{flex:1;font-size:13.5px;cursor:pointer}
.chk.done label{color:var(--mute);text-decoration:line-through}
.chk .note{width:110px;padding:6px 8px;font-size:14px;border-radius:7px;background:rgba(4,10,22,.75);border:1px solid var(--line);flex:none;color:var(--frost)}

.scrim{position:fixed;inset:0;background:rgba(2,4,10,.78);backdrop-filter:blur(5px);z-index:60;
  display:grid;place-items:center;padding:16px;padding-top:calc(16px + var(--safeT))}
.modal{background:linear-gradient(180deg,rgba(10,18,34,.97),rgba(4,8,18,.98));
  border:1px solid var(--line-hot);border-radius:18px;width:min(560px,100%);
  max-height:86dvh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.modal header{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal header h2{margin:0;font-size:16.5px;font-weight:650}
.modal .mb{padding:18px;overflow-y:auto}
.modal footer{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.x{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--mute);font-size:19px;line-height:1;flex:none}
.x:hover{background:var(--panel);color:var(--frost)}
.x svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ── dashboard ───────────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:13px;padding:12px}
.stat .l{color:var(--mute);font-size:10px;font-weight:800;letter-spacing:.06em;margin-bottom:6px;line-height:1.25}
.stat .v{font-size:23px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .u{color:var(--mute);font-size:10.5px;margin-top:3px}
.dashgrid{display:grid;grid-template-columns:1fr 1.05fr 1fr;gap:14px;align-items:start}
.qa-rw{display:flex;align-items:center;gap:11px;padding:11px 4px;border-radius:10px;width:100%;text-align:left}
.qa-rw:hover{background:var(--raised)}
.qa-rw .ic{width:36px;height:36px;border-radius:10px;background:rgba(127,212,245,.14);color:var(--ice);
  display:grid;place-items:center;flex:none}
.qa-rw .ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8}
.qa-rw .t{flex:1;min-width:0}
.qa-rw .t b{display:block;font-size:13.5px;font-weight:650}
.qa-rw .t small{color:var(--mute);font-size:11.5px}
.qa-rw .chev{color:var(--mute);flex:none}

.hero{position:relative;overflow:hidden;text-align:center;padding:26px 18px;
  display:flex;flex-direction:column;align-items:center;gap:12px}
.hero img{width:min(280px,80%);height:auto;filter:drop-shadow(0 0 22px rgba(56,169,220,.45))}
.hero .tag{color:var(--ice);font-size:11px;font-weight:800;letter-spacing:.2em}
.hero .badge{margin-top:2px;padding:7px 16px;border-radius:999px;
  background:rgba(127,212,245,.12);border:1px solid var(--line-hot);color:var(--frost);
  font-size:11.5px;font-weight:700;letter-spacing:.05em}

.notif{display:flex;gap:10px;padding:10px 4px;align-items:flex-start}
.notif .dot{width:8px;height:8px;border-radius:99px;margin-top:5px;flex:none}
.notif .dot.warn{background:var(--amber)} .notif .dot.info{background:var(--ice)} .notif .dot.ok{background:var(--mint)}
.notif b{display:block;font-size:13px;font-weight:650}
.notif small{color:var(--mute);font-size:11.5px}

.soon{padding:8px 0}
.soon .ic{width:56px;height:56px;border-radius:16px;background:rgba(127,212,245,.12);border:1px solid var(--line-hot);
  display:grid;place-items:center;margin:0 auto 16px}
.soon .ic svg{width:26px;height:26px;stroke:var(--ice);fill:none;stroke-width:1.6}

.techrow{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--panel);border:1px solid var(--line);
  border-radius:11px;margin-bottom:8px}
.techrow .t{flex:1;font-weight:600;font-size:13.5px}

.segw{display:flex;gap:6px;margin-bottom:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
.segw button{flex:1;padding:9px;border-radius:8px;font-size:13px;font-weight:650;color:var(--mute)}
.segw button.on{background:var(--raised);color:var(--ice)}

/* ── CHILL BRO ───────────────────────────────────── */
.bro-tab{
  position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:50;
  width:60px;padding:12px 0 10px;border-radius:16px 0 0 16px;
  background:linear-gradient(160deg,rgba(30,62,99,.95),rgba(8,16,32,.95));
  border:1px solid var(--line-hot);border-right:0;backdrop-filter:blur(10px);
  display:grid;justify-items:center;gap:7px;box-shadow:-8px 0 28px rgba(0,0,0,.55)
}
.bro-tab:hover{background:linear-gradient(160deg,rgba(39,80,125,.95),rgba(18,37,63,.95))}
.bro-tab .av{width:40px;height:36px;display:block}
.bro-tab .lbl{writing-mode:vertical-rl;font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--ice)}
.bro-tab .dot{width:6px;height:6px;border-radius:99px;background:var(--mint);box-shadow:0 0 8px var(--mint)}

.bro{
  position:fixed;top:0;right:0;height:100dvh;width:min(430px,100vw);z-index:70;
  background:linear-gradient(180deg,rgba(6,14,28,.97),rgba(2,6,14,.99));
  border-left:1px solid var(--line-hot);backdrop-filter:blur(18px);
  display:flex;flex-direction:column;transform:translateX(102%);
  transition:transform .26s cubic-bezier(.32,.72,0,1);box-shadow:-16px 0 50px rgba(0,0,0,.6)
}
.bro.open{transform:none}
@media (prefers-reduced-motion:reduce){.bro{transition:none}}
.bro-hd{display:flex;align-items:center;gap:11px;flex:none;
  padding:calc(12px + var(--safeT)) 14px 12px;border-bottom:1px solid var(--line)}
.bro-hd .face{width:48px;height:44px;flex:none;display:block}
.bro-hd strong{display:block;font-size:14.5px;font-weight:650}
.bro-hd small{color:var(--mint);font-size:11.5px;display:flex;align-items:center;gap:5px}
.bro-hd small i{width:5px;height:5px;border-radius:99px;background:var(--mint);font-style:normal}
.bro-hd .hdinfo{flex:1;min-width:0}
.vbtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--mute);flex:none;
  border:1px solid transparent}
.vbtn:hover{background:var(--panel);color:var(--frost)}
.vbtn.on{color:var(--ice);border-color:var(--line-hot);background:rgba(127,212,245,.1)}
.vbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.vbtn[hidden]{display:none}

.bro-thread{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:11px;-webkit-overflow-scrolling:touch}
.msg{max-width:88%;padding:11px 13px;border-radius:15px;font-size:13.5px;line-height:1.52;white-space:pre-wrap;word-wrap:break-word}
.msg.bro{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start}
.msg.me{background:linear-gradient(135deg,var(--ice-deep),#2A87B4);color:#04121F;border-bottom-right-radius:5px;align-self:flex-end;font-weight:500}
.msg b{color:var(--ice);font-weight:650}
.msg.me b{color:#03202f}
.msg code{background:rgba(4,10,22,.8);padding:1px 5px;border-radius:4px;font-size:12.5px}
.msg .src{display:block;margin-top:7px;padding-top:7px;border-top:1px solid var(--line);color:var(--mute);font-size:11.5px}

.bro-chips{display:flex;gap:7px;padding:0 14px 11px;flex-wrap:wrap;flex:none}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line-hot);background:var(--panel);
  font-size:12px;font-weight:600;color:var(--ice)}
.chip:hover{background:var(--raised)}

.bro-cmp{padding:12px 14px calc(14px + var(--safeB));border-top:1px solid var(--line);flex:none;
  display:flex;gap:8px;align-items:flex-end}
.bro-cmp textarea{flex:1;background:rgba(4,10,22,.8);border:1px solid var(--line);border-radius:12px;padding:11px 12px;
  font-size:16px;resize:none;max-height:110px;min-height:44px;line-height:1.45}
.bro-cmp textarea:focus{outline:none;border-color:var(--ice-deep)}
.snd,.mic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.snd{background:linear-gradient(135deg,var(--ice),var(--ice-deep));color:#04121F}
.mic{background:var(--raised);border:1px solid var(--line-hot);color:var(--ice)}
.mic.rec{background:var(--rose);color:#2A0008;border-color:transparent;animation:pulse 1.1s infinite}
.mic[hidden]{display:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.snd:disabled{opacity:.4}
.snd svg,.mic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}

.typing{display:flex;gap:4px;padding:12px 14px}
.typing i{width:6px;height:6px;border-radius:99px;background:var(--mute);animation:bl 1.1s infinite}
.typing i:nth-child(2){animation-delay:.16s} .typing i:nth-child(3){animation-delay:.32s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}

.toast{position:fixed;bottom:calc(24px + var(--safeB));left:50%;transform:translateX(-50%);z-index:90;
  background:var(--raised);border:1px solid var(--ice-deep);border-radius:12px;padding:11px 18px;
  font-size:13.5px;font-weight:600;box-shadow:0 12px 34px rgba(0,0,0,.6);backdrop-filter:blur(10px);
  max-width:calc(100vw - 32px);text-align:center}

/* ── mascot (real art) ───────────────────────────── */
.avatar{width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 0 7px rgba(56,169,220,.55));
  animation:sway 3.8s ease-in-out infinite}
@keyframes sway{
  0%,100%{transform:rotate(-2deg) translateY(0)}
  50%{transform:rotate(2deg) translateY(-2px)}
}
.avatar.talking{animation:talkbob .46s ease-in-out infinite}
@keyframes talkbob{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-2.5px) scale(1.05)}
}
@media (prefers-reduced-motion:reduce){.avatar,.avatar.talking{animation:none}}

/* ── loading splash ──────────────────────────────── */
.splash{position:fixed;inset:0;z-index:200;background:#010104;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  padding:24px;transition:opacity .45s ease,visibility .45s}
.splash.gone{opacity:0;visibility:hidden;pointer-events:none}
.splash .bro{width:min(300px,72vw);height:auto;border-radius:18px;
  animation:floaty 3s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.splash .cap{font-family:var(--display);font-size:13px;letter-spacing:.24em;color:var(--ice);
  text-align:center}
.splash .bar{width:min(230px,62vw);height:4px;border-radius:99px;background:rgba(127,212,245,.16);overflow:hidden}
.splash .bar i{display:block;height:100%;width:36%;border-radius:99px;
  background:linear-gradient(90deg,transparent,var(--ice),transparent);animation:slide 1.15s infinite}
@keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}
@media (prefers-reduced-motion:reduce){
  .splash .bro,.splash .bar i{animation:none}
}

/* ── mobile ──────────────────────────────────────── */
@media(max-width:860px){
  .shell{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .rail{grid-row:2;flex-direction:row;justify-content:flex-start;border-right:0;
    border-top:1px solid var(--line);
    padding:6px 6px calc(6px + var(--safeB));overflow-x:auto;gap:2px;
    scroll-snap-type:x proximity}
  .mark{display:none}
  .rail-sp{display:none}
  .navbtn{width:auto;min-width:70px;padding:7px 8px;flex-direction:column;gap:4px;scroll-snap-align:center}
  .navbtn span{font-size:9.5px;text-align:center;line-height:1.2}
  .navbtn svg{width:20px;height:20px}
  .main{grid-row:1}
  .board{grid-template-columns:1fr}
  .row2,.row3{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .dashgrid{grid-template-columns:1fr}
  /* force every inline 2-col grid to stack on phones */
  .grid[style*="grid-template-columns"]{grid-template-columns:1fr !important}
  .stats[style*="grid-template-columns"]{grid-template-columns:repeat(2,1fr) !important}
  .body{padding:14px 13px calc(30px + var(--safeB))}
  .top{padding:calc(10px + var(--safeT)) 14px 11px}
  .top h1{font-size:19px}
  .bro-tab{top:auto;bottom:calc(96px + var(--safeB));transform:none;
    width:auto;padding:8px 13px;border-radius:16px 0 0 16px;grid-auto-flow:column;align-items:center}
  .bro-tab .lbl{writing-mode:horizontal-tb}
  .bro-tab .av{width:32px;height:29px}
  .modal footer .btn{flex:1;min-width:120px}
}
</style>
</head>
<body>

<div class="bgwrap" aria-hidden="true"></div>

<div class="splash" id="splash" role="status" aria-label="Loading Chill Pros Command Center">
  <img class="bro" src="/bro-full.jpg" alt="Chill Bro">
  <div class="cap">COMMAND CENTER</div>
  <div class="bar"><i></i></div>
</div>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Main"></nav>
  <div class="main">
    <header class="top">
      <div><h1 id="vTitle" class="icy-title">Dashboard</h1><div class="sub" id="vSub"></div></div>
      <div class="top-sp"></div>
      <div id="topAct"></div>
    </header>
    <div class="body" id="view"></div>
  </div>
</div>

<button class="bro-tab" id="broTab" aria-label="Open Chill Bro">
  <img class="av avatar" src="/bro-head.webp" alt="">
  <span class="lbl">CHILL BRO</span>
  <span class="dot"></span>
</button>

<aside class="bro" id="bro" aria-label="Chill Bro assistant" aria-hidden="true">
  <div class="bro-hd">
    <img class="face avatar" id="broFace" src="/bro-head.webp" alt="">
    <div class="hdinfo">
      <strong>Chill Bro</strong>
      <small><i></i><span id="broStatus">Field brain loaded · works offline</span></small>
    </div>
    <button class="vbtn" id="broVoice" aria-label="Voice on or off" aria-pressed="false"></button>
    <button class="x" id="broClose" aria-label="Close">&times;</button>
  </div>
  <div class="bro-thread" id="broThread"></div>
  <div class="bro-chips" id="broChips"></div>
  <div class="bro-cmp">
    <textarea id="broInput" rows="1" placeholder="What's the unit doing?"></textarea>
    <button class="mic" id="broMic" aria-label="Speak" hidden>
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
    </button>
    <button class="snd" id="broSend" aria-label="Send">
      <svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
    </button>
  </div>
</aside>

<script src="app.js"></script>
</body>
</html>
