<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#071018">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chill Pros Owner">
  <title>Chill Pros — Owner Mobile</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071018}
    #phoneApp{display:block;width:100%;height:100dvh;border:0;background:#071018}
    #loading{position:fixed;inset:0;display:grid;place-items:center;background:#071018;color:#72d7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:.78rem;font-weight:800;letter-spacing:.08em;z-index:2}
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">LOADING CHILL PROS…</div>
  <iframe id="phoneApp" src="index.html" title="Chill Pros Owner Mobile Console"></iframe>
  <script>
    const frame = document.getElementById('phoneApp');
    const loading = document.getElementById('loading');

    frame.addEventListener('load', () => {
      const doc = frame.contentDocument;
      if (!doc) return;

      doc.body.classList.add('iphone-field-mode','iphone-owner-mode');
      doc.title = 'Chill Pros — Owner Mobile';

      ['iphone.css', 'iphone-polish.css', 'iphone-finish.css', 'iphone-command.css'].forEach(href => {
        const stylesheet = doc.createElement('link');
        stylesheet.rel = 'stylesheet';
        stylesheet.href = href;
        doc.head.appendChild(stylesheet);
      });

      const labels = ['Home','Intake','Queue','Jobs','Techs'];
      doc.querySelectorAll('.side-link').forEach((button,index) => {
        if (labels[index]) button.dataset.mobileLabel = labels[index];
      });

      const ownerStrip = doc.createElement('div');
      ownerStrip.className = 'owner-mobile-strip';
      ownerStrip.setAttribute('role','banner');
      ownerStrip.innerHTML = '<div><strong>Chill Pros Command Center</strong><span>Owner operations workspace</span></div><button type="button" id="ownerMoreButton" aria-expanded="false" aria-controls="ownerMobileMenu" aria-haspopup="true">MORE</button>';
      doc.querySelector('.main-panel')?.prepend(ownerStrip);

      const setupCommandDashboard = () => {
        const dashboard = doc.getElementById('dashboard');
        const metrics = dashboard?.querySelector('.metrics-grid');
        const featureGrid = dashboard?.querySelector('.feature-grid');
        const lowerGrid = dashboard?.querySelector('.lower-grid');
        if (!dashboard || !metrics || !featureGrid) return;

        dashboard.classList.add('mobile-command-dashboard');
        metrics.setAttribute('aria-label','Owner operating metrics');

        const commandHeader = doc.createElement('section');
        commandHeader.className = 'mobile-command-intro';
        commandHeader.setAttribute('aria-labelledby','mobileCommandTitle');
        commandHeader.innerHTML = `
          <div>
            <p class="eyebrow">LIVE OPERATIONS</p>
            <h2 id="mobileCommandTitle">Owner Command Center</h2>
            <p>Jobs, office priorities, and business health in one view.</p>
          </div>
          <span class="mobile-live-chip"><i aria-hidden="true"></i> Live</span>`;
        dashboard.insertBefore(commandHeader, metrics);

        const cards = [...featureGrid.querySelectorAll('.feature-card')];
        const findCard = label => cards.find(card => card.querySelector('h2')?.textContent.trim() === label);
        const jobsCard = findCard("TODAY'S JOBS");
        const queueCard = findCard('OFFICE QUEUE');
        const intakeCard = findCard('NEW CUSTOMER');
        const aiCard = findCard('AI DIAGNOSTICS');

        const primaryZone = doc.createElement('section');
        primaryZone.className = 'mobile-command-primary';
        primaryZone.setAttribute('aria-label','Primary operations');
        [jobsCard, queueCard].forEach((card, index) => {
          if (!card) return;
          card.classList.add('command-priority-card', index === 0 ? 'jobs-priority-card' : 'queue-priority-card');
          const title = card.querySelector('h2');
          if (title) title.insertAdjacentHTML('beforebegin', `<span class="command-card-kicker">${index === 0 ? 'FIELD' : 'OFFICE'}</span>`);
          primaryZone.appendChild(card);
        });

        const sectionLabel = doc.createElement('div');
        sectionLabel.className = 'mobile-section-heading';
        sectionLabel.innerHTML = '<div><p class="eyebrow">QUICK ACTIONS</p><h3>Move work forward</h3></div>';
        featureGrid.before(primaryZone, sectionLabel);

        [intakeCard, aiCard].forEach(card => {
          if (card) featureGrid.appendChild(card);
        });
        featureGrid.classList.add('mobile-quick-actions');

        if (lowerGrid) {
          const operationsLabel = doc.createElement('div');
          operationsLabel.className = 'mobile-section-heading mobile-support-heading';
          operationsLabel.innerHTML = '<div><p class="eyebrow">BUSINESS PULSE</p><h3>Schedule and recent activity</h3></div>';
          lowerGrid.before(operationsLabel);
          lowerGrid.classList.add('mobile-support-grid');
          lowerGrid.querySelector('.weather-card')?.classList.add('mobile-secondary-card');
        }
      };
      setupCommandDashboard();

      const ownerMenu = doc.createElement('nav');
      ownerMenu.id = 'ownerMobileMenu';
      ownerMenu.className = 'owner-mobile-menu';
      ownerMenu.setAttribute('aria-hidden','true');
      ownerMenu.setAttribute('aria-label','Owner tools');
      ownerMenu.innerHTML = `
        <button data-owner-view="maintenance">Maintenance</button>
        <button data-owner-view="equipment">Equipment</button>
        <button data-owner-view="parts">Parts</button>
        <button data-owner-view="ai">AI Diagnostics</button>
        <button data-owner-view="reports">Reports</button>
        <button data-owner-view="settings">Settings</button>`;
      doc.body.appendChild(ownerMenu);

      const moreButton = doc.getElementById('ownerMoreButton');
      const menuButtons = [...ownerMenu.querySelectorAll('button')];
      const closeMenu = ({ restoreFocus = false } = {}) => {
        ownerMenu.classList.remove('open');
        ownerMenu.setAttribute('aria-hidden','true');
        moreButton?.setAttribute('aria-expanded','false');
        if (restoreFocus) moreButton?.focus();
      };
      const openMenu = () => {
        ownerMenu.classList.add('open');
        ownerMenu.setAttribute('aria-hidden','false');
        moreButton?.setAttribute('aria-expanded','true');
        menuButtons[0]?.focus();
      };
      moreButton?.addEventListener('click', () => {
        if (ownerMenu.classList.contains('open')) closeMenu();
        else openMenu();
      });
      ownerMenu.querySelectorAll('[data-owner-view]').forEach(button => {
        button.addEventListener('click', () => {
          const target = button.dataset.ownerView;
          doc.querySelector(`.side-link[data-view="${target}"]`)?.click();
          closeMenu();
          doc.defaultView?.scrollTo({top:0,behavior:'smooth'});
        });
      });
      doc.addEventListener('click', event => {
        if (!ownerMenu.contains(event.target) && event.target !== moreButton) closeMenu();
      });
      doc.addEventListener('keydown', event => {
        if (event.key === 'Escape' && ownerMenu.classList.contains('open')) {
          event.preventDefault();
          closeMenu({ restoreFocus: true });
          return;
        }
        if (event.key !== 'Tab' || !ownerMenu.classList.contains('open') || !menuButtons.length) return;
        const firstButton = menuButtons[0];
        const lastButton = menuButtons[menuButtons.length - 1];
        if (event.shiftKey && doc.activeElement === firstButton) {
          event.preventDefault();
          lastButton.focus();
        } else if (!event.shiftKey && doc.activeElement === lastButton) {
          event.preventDefault();
          firstButton.focus();
        }
      });

      loading.remove();
    });
  </script>
</body>
</html>
